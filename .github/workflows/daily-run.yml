name: Daily trading run

# Runs the two daily commands after every US trading session:
#   1. python 9_aria_growth/aria_growth_daily_log.py   (ARIA-Growth snapshot, read-only)
#   2. python run_live.py                              (ARIA live paper trading)
#
# Schedule: 03:15 Asia/Dhaka = 21:15 UTC on the PREVIOUS calendar day, which is
# 16:15 (EST) / 17:15 (EDT) in New York — just after that day's close. So the
# session being covered is "today in New York", which is exactly the date both
# scripts stamp. Weekends are excluded by the cron (Mon–Fri UTC = Mon–Fri NY,
# i.e. Tue–Sat mornings in Dhaka); NYSE holidays are skipped by
# scripts/market_day.py. GitHub may start scheduled runs a few minutes late.
#
# State (models, price caches, trade/equity logs, growth CSVs) is git-ignored,
# so it travels as an encrypted bundle on the `bot-state` branch — see
# scripts/state_bundle.py and .github/DAILY_RUN.md.

on:
  schedule:
    - cron: "15 21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: --dry-run for both scripts, no orders, state NOT saved back"
        type: boolean
        default: true
      ignore_market_calendar:
        description: "Run even if the NYSE was closed (for testing on a holiday/weekend)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/daily-run.yml"
      - "scripts/**"
      - "requirements-live.txt"

permissions:
  contents: write   # push the updated state bundle to the bot-state branch

concurrency:
  group: daily-trading-run
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # PR runs are always a smoke test; scheduled runs are always live.
      DRY_RUN: ${{ (github.event_name == 'pull_request' || inputs.dry_run == true) && 'true' || 'false' }}
      FORCE: ${{ inputs.ignore_market_calendar == true && 'true' || 'false' }}
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
      STATE_KEY: ${{ secrets.STATE_KEY }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check required secrets
        id: secrets
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GROWTH_ALPACA_API_KEY: ${{ secrets.GROWTH_ALPACA_API_KEY }}
          GROWTH_ALPACA_SECRET_KEY: ${{ secrets.GROWTH_ALPACA_SECRET_KEY }}
        run: |
          missing=""
          for s in STATE_KEY ALPACA_API_KEY ALPACA_SECRET_KEY GROWTH_ALPACA_API_KEY GROWTH_ALPACA_SECRET_KEY; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch state bundle (bot-state branch)
        id: fetch
        if: steps.secrets.outputs.complete == 'true'
        run: |
          python3 scripts/state_bundle.py fetch --dest .state
          echo "py=$(cat .state/python-version 2>/dev/null || echo 3.12)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.fetch.outputs.py || '3.12' }}
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Is the US market open for this session?
        id: market
        run: |
          pip install --quiet exchange_calendars
          python scripts/market_day.py
          if [ "$FORCE" = "true" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            grep -q '^open=true' "$GITHUB_OUTPUT" && echo "go=true" >> "$GITHUB_OUTPUT" || echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Market closed — nothing to do
        if: steps.market.outputs.go != 'true'
        run: echo "### Market closed on ${{ steps.market.outputs.ny_date }} (NY) — skipped" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        if: steps.market.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip
          # Same library versions as the PC that pickled the models, when known.
          if [ -f .state/requirements.lock ]; then
            pip install -r .state/requirements.lock || {
              echo "::warning::Pinned install failed; installing pins one by one"
              while read -r req; do [ -n "$req" ] && pip install "$req" || echo "::warning::could not install $req"; done < .state/requirements.lock
            }
          fi
          pip install -r requirements-live.txt

      - name: Smoke test (no secrets on this run)
        if: steps.market.outputs.go == 'true' && steps.secrets.outputs.complete != 'true'
        run: |
          python 9_aria_growth/aria_growth_daily_log.py --help
          python run_live.py --help
          python -c "import sys; sys.path[:0]=['4_signals','5_backtesting','8_live_trading','3_market_data']; import live_engine, signal_engine, sector_signal_engine, hmm_regime, reconcile_trade_log; print('live stack imports OK')"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::Add the missing secrets before the scheduled run can trade."
            exit 1
          fi

      - name: Restore state
        id: restore
        if: steps.market.outputs.go == 'true' && steps.secrets.outputs.complete == 'true'
        run: python scripts/state_bundle.py unpack --src .state

      - name: "1/2 ARIA-Growth daily log"
        id: growth
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        env:
          GROWTH_ALPACA_API_KEY: ${{ secrets.GROWTH_ALPACA_API_KEY }}
          GROWTH_ALPACA_SECRET_KEY: ${{ secrets.GROWTH_ALPACA_SECRET_KEY }}
        run: python 9_aria_growth/aria_growth_daily_log.py $([ "$DRY_RUN" = "true" ] && echo --dry-run)

      - name: "2/2 ARIA live run"
        id: live
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python run_live.py $([ "$DRY_RUN" = "true" ] && echo --dry-run)

      - name: Save state back to bot-state
        if: steps.restore.outcome == 'success' && env.DRY_RUN != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          python scripts/state_bundle.py pack --out .state --no-pins
          python scripts/state_bundle.py publish --src .state \
            --message "state after run ${{ github.run_id }} (NY ${{ steps.market.outputs.ny_date }})"

      - name: Summary
        if: always() && steps.market.outputs.go == 'true'
        run: |
          {
            echo "### Daily run — NY ${{ steps.market.outputs.ny_date }} (dry run: $DRY_RUN)"
            echo "| step | result |"
            echo "|---|---|"
            echo "| aria_growth_daily_log.py | ${{ steps.growth.outcome || 'not run' }} |"
            echo "| run_live.py | ${{ steps.live.outcome || 'not run' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.growth.outcome }}" = "failure" ] || [ "${{ steps.live.outcome }}" = "failure" ]; then
            echo "::error::One of the daily commands failed — see its step log."
            exit 1
          fi
